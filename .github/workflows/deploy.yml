name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npm test

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (live on main, preview channel for PRs)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: drawmark-app
          channelId: ${{ github.event_name == 'push' && 'live' || format('pr{0}', github.event.number) }}
